version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: episode-chunker-db
    environment:
      POSTGRES_USER: chunker
      POSTGRES_PASSWORD: chunker_password
      POSTGRES_DB: episode_chunker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chunker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
